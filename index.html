<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C4DCC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>html,body{margin:0} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Lumi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen kid app, big touch targets, calm card center, fx canvas on top */
:root{
  --bg:#FBF7FE;
  --card:#FFFFFF;
  --ink:#3B2A52;
  --muted:#8E7FA8;
  --accent:#7C4DCC;
  --accent-soft:#F0E7FC;
  --line:#E7DDF5;
  --gold:#F2B83C;
  --ok:#3E9E72;
  --soft-ok:#E2F4EB;
  --warm:#E07A86;
  --soft-warm:#FBEAEC;
  --sky:#EAF4FD;
  --font-disp:'Baloo 2','Nunito','Comic Sans MS',sans-serif;
  --font-body:'Nunito','Baloo 2',sans-serif;
  color-scheme: light;
}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:17px; line-height:1.5;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  overflow:hidden;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
button{font-family:inherit; color:inherit; border:0; background:none; cursor:pointer; touch-action:manipulation;}
button:focus-visible, input:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:12px;}
#app{height:100%; display:flex; flex-direction:column; max-width:860px; margin:0 auto; padding-block:8px; padding-inline:16px;}
.screen{display:none; flex:1 1 auto; min-height:0; flex-direction:column;}
.screen.active{display:flex;}

/* top bar */
.bar{display:flex; align-items:center; gap:10px; padding-block:6px;}
.bar .spacer{flex:1;}
.iconbtn{
  width:52px; height:52px; border-radius:18px; background:var(--card);
  border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-disp); font-size:22px; color:var(--accent); flex:0 0 auto;
}
.iconbtn:active{transform:scale(.94);}
.starchip{
  display:flex; align-items:center; gap:6px; background:var(--card); border:2px solid var(--line);
  border-radius:18px; padding:8px 14px; font-family:var(--font-disp); font-weight:700; font-size:20px;
  font-variant-numeric:tabular-nums;
}
.starchip svg{width:22px;height:22px;}

/* home */
.hero{display:flex; flex-direction:column; align-items:center; gap:4px; padding-block:4px;}
.hero h1{font-family:var(--font-disp); font-weight:700; font-size:clamp(26px,5vw,36px); margin:0; text-wrap:balance; text-align:center;}
.hero .hello{color:var(--muted); font-weight:600; margin:0;}
#unicornHome{width:min(44vw,230px);}
.menu{display:grid; gap:14px; width:100%; max-width:460px; margin:10px auto 0;}
.bigbtn{
  display:flex; align-items:center; gap:14px; width:100%;
  background:var(--card); border:2px solid var(--line); border-radius:24px;
  padding:16px 18px; font-family:var(--font-disp); font-size:24px; font-weight:700; text-align:left;
  box-shadow:0 3px 0 var(--line);
}
.bigbtn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
.bigbtn .em{width:46px; height:46px; border-radius:16px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:24px; flex:0 0 auto;}
.bigbtn small{display:block; font-family:var(--font-body); font-size:14px; font-weight:600; color:var(--muted);}
.bigbtn[disabled]{opacity:.45; box-shadow:none;}
.footrow{display:flex; justify-content:center; gap:16px; padding-block:10px 4px;}
.ghostbtn{color:var(--muted); font-weight:700; font-size:15px; padding:8px 12px; border-radius:12px;}

/* task screens */
.taskwrap{flex:1; display:flex; flex-direction:column; min-height:0;}
.progressdots{display:flex; gap:7px; justify-content:center; padding-block:6px;}
.pdot{width:12px; height:12px; border-radius:50%; background:var(--line);}
.pdot.done{background:var(--gold);}
.pdot.now{background:var(--accent);}
.taskcard{
  background:var(--card); border:2px solid var(--line); border-radius:28px;
  padding:14px 16px; display:flex; flex-direction:column; align-items:center; gap:4px;
  flex:1 1 auto; min-height:0; justify-content:center; position:relative;
}
.question{
  font-family:var(--font-disp); font-weight:700; font-variant-numeric:tabular-nums;
  font-size:clamp(40px,9vw,72px); letter-spacing:1px; margin:0; display:flex; align-items:baseline; gap:14px;
  flex-wrap:wrap; justify-content:center;
}
.answerbox{
  min-width:120px; padding:2px 18px; border-bottom:5px solid var(--accent);
  color:var(--accent); min-height:1.2em; text-align:center;
}
.answerbox.empty{color:var(--line);}
.feedback{min-height:34px; font-family:var(--font-disp); font-weight:700; font-size:22px; text-align:center;}
.feedback.good{color:var(--ok);}
.feedback.again{color:var(--warm);}
.micline{display:flex; align-items:center; gap:10px; min-height:40px; color:var(--muted); font-weight:700; font-size:15px;}
.micdot{width:14px; height:14px; border-radius:50%; background:var(--line); flex:0 0 auto;}
.micline.listening .micdot{background:var(--warm); animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}

.pad{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  width:100%; max-width:380px; margin:10px auto 0; flex:0 0 auto;
}
.pad button{
  font-family:var(--font-disp); font-size:30px; font-weight:700;
  background:var(--card); border:2px solid var(--line); border-radius:20px;
  padding-block:10px; box-shadow:0 3px 0 var(--line); min-height:60px;
}
.pad button:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
.pad .okkey{background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 3px 0 #5C36A0;}
.pad .delkey{color:var(--muted); font-size:24px;}

/* ride */
.ridegrid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; width:100%; max-width:560px; margin:8px auto;}
.rowpick{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:12px; width:100%; max-width:560px; margin:12px auto; overflow-y:auto;}
.rowbtn{
  background:var(--card); border:2px solid var(--line); border-radius:20px; padding:12px 6px;
  font-family:var(--font-disp); font-weight:700; font-size:26px; box-shadow:0 3px 0 var(--line);
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.rowbtn small{font-size:12px; font-family:var(--font-body); color:var(--muted); font-weight:700;}
.rowbtn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
.rowbtn.locked{opacity:.4; box-shadow:none;}
.cloud{
  background:var(--sky); border:2px solid #D3E6F8; border-radius:18px; padding:8px 4px;
  font-family:var(--font-disp); font-weight:700; font-size:22px; text-align:center;
  font-variant-numeric:tabular-nums; color:var(--ink); min-height:70px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
}
.cloud .q{font-size:14px; color:var(--muted); font-family:var(--font-body); font-weight:700;}
.cloud .v{min-height:1.2em;}
.cloud.hidden-v .v{color:transparent; text-shadow:0 0 14px rgba(59,42,82,.45);}
.cloud.done{background:var(--soft-ok); border-color:#BCE3CF;}
.cloud.next{border-color:var(--accent); background:var(--accent-soft);}
.ridetimer{font-family:var(--font-disp); font-weight:700; font-size:22px; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums;}

/* blitz */
.blitzbar{height:14px; border-radius:7px; background:var(--line); overflow:hidden; width:100%; max-width:560px; margin:6px auto;}
.blitzbar i{display:block; height:100%; border-radius:7px; background:linear-gradient(90deg,#F96D6D,#F2B83C,#4FC47F,#58A6F0,#9A6AE8); transition:width .25s linear;}

/* path / progress */
.pathlist{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-block:8px 20px;}
.station{
  display:flex; align-items:center; gap:14px; background:var(--card); border:2px solid var(--line);
  border-radius:22px; padding:12px 16px;
}
.station .num{
  width:54px; height:54px; border-radius:18px; background:var(--accent-soft);
  font-family:var(--font-disp); font-weight:700; font-size:24px; color:var(--accent);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.station.locked{opacity:.5;}
.station.mastered .num{background:var(--gold); color:#fff;}
.ministars{display:flex; gap:3px; flex-wrap:wrap;}
.ministars svg{width:13px; height:13px;}
.station .lbl{font-weight:700;}
.station .sub{font-size:13px; color:var(--muted); font-weight:600;}

/* Inselwelt */
.islmap{flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding-block:8px 24px; align-content:start;}
.islcard{background:var(--card); border:2px solid var(--line); border-radius:22px; padding:8px 8px 10px; text-align:left; display:flex; flex-direction:column; gap:4px; box-shadow:0 3px 0 var(--line);}
.islcard:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
.islcard > svg.isl{width:100%; height:auto; display:block; border-radius:14px;}
.islcard .nm{font-family:var(--font-disp); font-weight:700; font-size:17px; line-height:1.15;}
.islcard .st{font-size:12px; color:var(--muted); font-weight:700;}
.islcard.locked{opacity:.75;}
.islcard .ministars{margin-top:2px;}
.isltitle{font-family:var(--font-disp); font-size:19px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.islwrap{flex:1; overflow-y:auto; display:flex; flex-direction:column; align-items:center; gap:10px; padding-block:4px 30px;}
.islwrap > *{flex-shrink:0;}
.islstage{width:100%; max-width:420px;}
.islstage svg{width:100%; height:auto; display:block; border-radius:28px; border:2px solid var(--line);}
.islbubble{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:10px 14px; font-weight:700; font-size:15px; line-height:1.4; text-align:center; max-width:420px; width:100%; min-height:40px;}
.islprogress{display:flex; gap:4px; align-items:center; font-size:13px; color:var(--muted); font-weight:700;}
.islprogress svg{width:16px;height:16px;}
.islh2{font-family:var(--font-disp); font-size:20px; margin:8px 0 0;}
.shop{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:420px;}
.shopcard{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:8px 6px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;}
.shopcard svg{width:56px; height:56px;}
.shopcard .nm{font-size:12px; font-weight:700; line-height:1.15; min-height:2.3em;}
.shopcard .needmore{font-size:11px; color:var(--muted); font-weight:700;}
.giftline{font-size:13px; color:var(--muted); font-weight:700; text-align:center; margin-top:6px;}
/* Geschenk-Wahl am Rundenende */
.giftrow{display:flex; gap:12px; justify-content:center; width:100%;}
.giftcard{flex:1 1 0; min-width:0; background:#fff; border:3px solid var(--line); border-radius:22px; padding:10px 6px 12px; display:flex; flex-direction:column; align-items:center; gap:6px; font:inherit; color:var(--ink); cursor:pointer; transition:transform .15s, border-color .15s;}
.giftcard:active{transform:scale(.96);}
.giftcard:hover{border-color:var(--accent);}
.giftcard svg{width:118px; height:100px; overflow:visible;}
.giftcard .nm{font-weight:800; font-size:15px; line-height:1.15;}
.giftcard .lvl{font-size:12px; color:var(--accent); font-weight:700;}
.giftcard .desc{font-size:12px; color:var(--muted); font-weight:600; line-height:1.2;}
.giftcard svg{width:130px; height:110px; border-radius:14px; background:#F4F0FB;}
.giftbig svg{overflow:visible;}
.giftnote{font-size:14px; color:var(--muted); font-weight:700; margin-top:6px;}
.shopbtn{font-family:var(--font-disp); font-weight:700; font-size:15px; border-radius:12px; padding:6px 10px; background:var(--accent); color:#fff; box-shadow:0 3px 0 #5C36A0; display:flex; align-items:center; gap:4px;}
.shopbtn svg{width:14px;height:14px;}
.shopbtn[disabled]{background:var(--line); color:var(--muted); box-shadow:none;}
.shopbtn.done{background:var(--soft-ok); color:var(--ok); box-shadow:none;}
/* Insel-Animationen (nur mit .isl-anim) */
.isl-anim .isl-animal{transform-box:fill-box; transform-origin:50% 100%; animation:islbob 2.4s ease-in-out infinite;}
.isl-anim .isl-animal.isl-sleep{animation:islbreathe 3.2s ease-in-out infinite;}
.isl-anim .isl-animal.hop{animation:islhop .7s ease;}
@keyframes islbob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-6px) scaleY(1.02)}}
@keyframes islbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes islhop{0%{transform:translateY(0)}35%{transform:translateY(-26px) rotate(-6deg)}70%{transform:translateY(0) scaleY(.92)}100%{transform:translateY(0)}}
.isl-anim .isl-zzz{animation:islzzz 3.2s ease-in-out infinite; transform-box:fill-box; transform-origin:0 100%;}
@keyframes islzzz{0%{opacity:0; transform:translateY(4px)}30%{opacity:1}100%{opacity:0; transform:translateY(-10px)}}
.isl-anim .isl-cloud{animation:islcloud 9s ease-in-out infinite;}
.isl-anim .isl-cloud2{animation:islcloud 13s ease-in-out infinite reverse;}
@keyframes islcloud{50%{transform:translateX(10px)}}
.isl-anim .isl-wave{animation:islwave 3s linear infinite;}
@keyframes islwave{to{transform:translateX(40px)}}
.isl-anim .isl-twinkle{animation:twinkle 2.4s ease-in-out infinite;}
.isl-anim .isl-build{transform-box:fill-box; transform-origin:50% 100%;}
.isl-anim .isl-build.pop{animation:islpop .6s cubic-bezier(.3,1.4,.5,1);}
@keyframes islpop{0%{transform:scale(0)}100%{transform:scale(1)}}
/* end / reward */
.endcard{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; flex:1; text-align:center;}
.endcard h2{font-family:var(--font-disp); font-size:clamp(28px,6vw,40px); margin:0;}
.endcard .big{font-family:var(--font-disp); font-size:26px; font-weight:700;}
.pill{background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:6px 16px; font-weight:700;}
.btnrow{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
.cta{
  background:var(--accent); color:#fff; font-family:var(--font-disp); font-weight:700; font-size:22px;
  border-radius:20px; padding:14px 28px; box-shadow:0 4px 0 #5C36A0;
}
.cta:active{transform:translateY(2px); box-shadow:0 2px 0 #5C36A0;}
.cta.sec{background:var(--card); color:var(--accent); border:2px solid var(--line); box-shadow:0 4px 0 var(--line);}

/* parent */
.gatecard{max-width:420px; margin:auto; background:var(--card); border:2px solid var(--line); border-radius:24px; padding:24px; text-align:center; display:flex; flex-direction:column; gap:12px;}
.gatecard input{font-size:28px; font-family:var(--font-disp); text-align:center; border:2px solid var(--line); border-radius:14px; padding:8px; width:120px; margin:0 auto;}
.parentwrap{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:16px; padding-block:6px 30px;}
.parentwrap h2{font-family:var(--font-disp); font-size:22px; margin:12px 0 2px;}
.parentwrap h3{font-size:16px; margin:6px 0 2px;}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px;}
.kpi{background:var(--card); border:2px solid var(--line); border-radius:16px; padding:10px 12px;}
.kpi b{display:block; font-family:var(--font-disp); font-size:24px; font-variant-numeric:tabular-nums;}
.kpi span{font-size:12px; color:var(--muted); font-weight:700;}
.heat{display:grid; grid-template-columns:auto repeat(10,1fr); gap:3px; max-width:520px; font-variant-numeric:tabular-nums;}
.heat .h{font-size:11px; color:var(--muted); font-weight:700; display:flex; align-items:center; justify-content:center; min-height:18px;}
.heat .c{aspect-ratio:1; border-radius:5px; background:var(--line); display:flex; align-items:center; justify-content:center; font-size:10px; color:rgba(59,42,82,.65); min-width:0;}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--muted); font-weight:700; align-items:center;}
.legend i{width:14px; height:14px; border-radius:4px; display:inline-block; margin-right:4px; vertical-align:-2px;}
.chart{display:flex; align-items:flex-end; gap:5px; height:120px; max-width:560px; border-bottom:2px solid var(--line); padding-block:0 0;}
.chart .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:2px; min-width:0; height:100%;}
.chart .b{width:70%; background:var(--accent); border-radius:5px 5px 0 0; min-height:0;}
.chart .l{font-size:9px; color:var(--muted); font-weight:700;}
.chart .v{font-size:10px; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums;}
.setrow{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:10px 14px;}
.setrow label{font-weight:700;}
.setrow input[type=text]{border:2px solid var(--line); border-radius:10px; padding:6px 10px; font-size:16px; width:140px; font-family:inherit;}
.toggle{width:58px; height:32px; border-radius:16px; background:var(--line); position:relative; flex:0 0 auto;}
.toggle i{position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:left .15s;}
.toggle.on{background:var(--ok);}
.toggle.on i{left:29px;}
textarea.backup{width:100%; height:90px; border:2px solid var(--line); border-radius:12px; font-size:12px; padding:8px; font-family:monospace;}
.smallbtn{background:var(--card); border:2px solid var(--line); border-radius:12px; padding:8px 14px; font-weight:700; color:var(--accent);}
.danger{color:var(--warm); border-color:var(--soft-warm);}
.besttimes{display:flex; gap:8px; flex-wrap:wrap;}
.besttimes .pill{background:var(--card); border:2px solid var(--line); color:var(--ink); font-variant-numeric:tabular-nums;}

/* Wolkenflug (Runner) */
#scr-run{position:relative;}
.sky{
  flex:1; min-height:0; position:relative; overflow:hidden; border-radius:28px;
  background:linear-gradient(180deg,#CFE8FB 0%,#E9E2FA 60%,#FBEFF7 100%);
  border:2px solid #D3E6F8;
  display:flex; flex-direction:column;
}
.cloudband{position:absolute; left:0; width:200%; display:flex; gap:60px; opacity:.8; pointer-events:none;}
.cloudband span{width:120px;height:44px;background:#fff;border-radius:999px;flex:0 0 auto;box-shadow:30px 10px 0 -6px #fff,-28px 12px 0 -8px #fff;}
.cb1{top:8%; animation:drift 26s linear infinite;}
.cb2{top:34%; animation:drift 40s linear infinite; opacity:.55; transform:scale(.7);}
.cb3{top:62%; animation:drift 60s linear infinite; opacity:.35; transform:scale(.5);}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.runQ{
  position:relative; z-index:2; text-align:center; padding:14px 16px 4px;
  font-family:var(--font-disp); font-weight:700; font-size:clamp(30px,6vw,46px);
  font-variant-numeric:tabular-nums; text-wrap:balance;
}
.runQ small{display:block; font-size:15px; font-family:var(--font-body); color:var(--muted); font-weight:700;}
/* ===== Wolkenritt: Szene läuft in PixiJS (game.js), hier nur Rahmen und Overlays ===== */
.sky{background:linear-gradient(180deg,#BBDDF8 0%,#E9E2FA 55%,#FBEFF7 100%);}
.world{position:relative; flex:1; min-height:0; z-index:2; overflow:hidden; border-radius:0 0 26px 26px;}
.world canvas{display:block;}
.runQ{position:relative; z-index:3; display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 16px 2px;}
.runQ .qchip{background:rgba(255,255,255,.92); border-radius:18px; padding:4px 18px 7px; text-align:center;
  font-family:var(--font-disp); font-weight:700; font-size:clamp(26px,5.6vw,40px); font-variant-numeric:tabular-nums; color:var(--ink);
  box-shadow:0 3px 0 rgba(170,195,230,.45);}
.runQ .qchip small{display:block; font-size:14px; font-family:var(--font-body); color:var(--muted); font-weight:700;}
#runDots{display:flex; gap:5px; align-items:center;}
#runDots b{width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.75); border:2px solid rgba(170,195,230,.6);}
#runDots b.done{background:var(--gold); border-color:var(--gold);}
#runDots b.now{background:var(--accent); border-color:var(--accent);}
#runDots s{width:7px;}

<script>
'use strict';
/* ================= LOGIC-START (pure, DOM-free, node-testable) ================= */
const ROW_ORDER = [2,10,5,1,4,8,3,6,9,7];           // didaktische Reihenfolge: Kernreihen zuerst, 7 zuletzt
const BOX_WEIGHT = [8,6,4,2.2,1.1,0.5];              // Auswahlgewicht je Leitner-Box 0..5
const DUE_DAYS   = [0,0,1,2,4,8];                    // Wiedervorlage in Tagen je Box
const FAST_MS = 4000;                                // "aus dem Kopf"-Schwelle
const ROW_UNLOCK_MIN_BOX = 3, ROW_UNLOCK_SHARE = 0.8;

function factKey(a,b){ return a+'x'+b; }
function todayStr(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function defaultState(now){
  now = now || Date.now();
  const facts = {};
  for(const r of ROW_ORDER) for(let b=1;b<=10;b++) facts[factKey(r,b)] = {box:0, seen:0, ok:0, no:0, last:0, rt:[]};
  return {
    v:1, name:'Romy', sound:true, tasksPerRound:10,
    facts, stars:0, items:0, gear:{}, rewards:0,   // gear: {extra:stufe}, rewards: eingelöste Geschenke
    days:{},                      // 'YYYY-MM-DD' -> {sec,tasks,ok}
    streak:{len:0,last:''},
    best:{blitz:0, rows:{}},     // rows: reihe -> sekunden
    spent:0, islands:{},         // Sterne ausgegeben, Ausbauten je Insel: {reihe:[ids]}
    created: now
  };
}

function rowFacts(state,row){ const out=[]; for(let b=1;b<=10;b++) out.push(state.facts[factKey(row,b)]); return out; }
function rowMastery(state,row){ return rowFacts(state,row).filter(f=>f.box>=ROW_UNLOCK_MIN_BOX).length/10; }

/* Freigeschaltete Reihen: Reihe i+1 öffnet, wenn Reihe i gemeistert ist. Mindestens eine offen. */
function unlockedRows(state){
  const open=[ROW_ORDER[0]];
  for(let i=0;i<ROW_ORDER.length-1;i++){
    if(rowMastery(state,ROW_ORDER[i])>=ROW_UNLOCK_SHARE) open.push(ROW_ORDER[i+1]); else break;
  }
  return open;
}
function nextLockedRow(state){ const u=unlockedRows(state); return ROW_ORDER.find(r=>!u.includes(r)) ?? null; }

function isDue(f, now){
  if(f.seen===0) return true;
  return (now - f.last) >= DUE_DAYS[f.box]*86400000;
}

/* Gewichtete Aufgabenwahl. recentKeys: zuletzt gestellte (vermeiden). rng: ()=>[0,1) */
function pickTask(state, recentKeys, now, rng){
  rng = rng || Math.random;
  const open = unlockedRows(state);
  const cand = [];
  for(const r of open){
    for(let b=1;b<=10;b++){
      const k=factKey(r,b), f=state.facts[k];
      let w = BOX_WEIGHT[f.box];
      if(isDue(f,now)) w*=2.2;
      if(f.no>f.ok) w*=1.6;                           // Stolperfakten anziehen
      if(recentKeys.includes(k)) w*=0.05;             // direkte Wiederholung vermeiden
      cand.push({k,r,b,w,f});
    }
  }
  let sum=0; for(const c of cand) sum+=c.w;
  let t=rng()*sum, chosen=cand[cand.length-1];
  for(const c of cand){ t-=c.w; if(t<=0){ chosen=c; break; } }
  // Form: Division erst, wenn der Mal-Fakt sitzt (Box>=3): dann zu 35 %. Tauschaufgabe zu 40 %.
  let type='mul';
  if(chosen.f.box>=3 && rng()<0.35) type='div';
  const swap = type==='mul' && rng()<0.4;
  const a = swap? chosen.b : chosen.r, b = swap? chosen.r : chosen.b;
  if(type==='mul') return {key:chosen.k, a, b, type, show:a+' · '+b, answer:a*b, say:a+' mal '+b};
  // Division: Produkt ÷ Reihenzahl = b  (oder umgekehrt)
  const divBySwap = rng()<0.5;
  const d1 = chosen.r*chosen.b, d2 = divBySwap? chosen.b : chosen.r, ans = divBySwap? chosen.r : chosen.b;
  return {key:chosen.k, a:d1, b:d2, type, show:d1+' : '+d2, answer:ans, say:d1+' geteilt durch '+d2};
}

/* Ergebnis einarbeiten. correct:boolean, rt:ms */
function applyResult(state, key, correct, rt, now){
  const f = state.facts[key]; if(!f) return;
  f.seen++; f.last=now;
  f.rt.push(Math.min(rt,20000)); if(f.rt.length>5) f.rt.shift();
  if(correct){
    f.ok++;
    if(rt<=FAST_MS) f.box=Math.min(5,f.box+1);
    else f.box=Math.min(5,Math.max(f.box, f.box<2? f.box+1 : f.box)); // langsam richtig: unten +1, oben halten
  }else{
    f.no++; f.box = Math.max(0, Math.min(f.box,1)); // zurück in Box 1
  }
}

/* Tempo-Stufe eines Fakts: 'neu' (noch nie oder gerade erst gesehen), 'uebt', 'sicher'.
   Daraus entsteht der Zeitplan der Tore: wie lange sie anfliegen, ab wann sie kriechen, ob sie stehen bleiben. */
function factStage(f){
  if(!f || f.seen===0 || f.box<=1) return 'neu';
  if(f.box<=3) return 'uebt';
  return 'sicher';
}
function gatePlan(stage, f){
  const rt=f&&avgRt(f);
  if(stage==='neu')  return {stage, approachMs:14000, crawlAt:0.82, crawlMs:4000, stopAt:0.9,  boost:false};
  if(stage==='uebt') return {stage, approachMs:Math.round(Math.min(14000,Math.max(9000,(rt||5000)*2.2+4000))), crawlAt:0.8, crawlMs:6000, stopAt:null, boost:false};
  return {stage, approachMs:Math.round(Math.min(9000,Math.max(5500,(rt||3000)*1.8+2500))), crawlAt:0.85, crawlMs:2500, stopAt:null, boost:true};
}
/* Nicht rechtzeitig getippt: zählt als Zögern, nicht als Fehler. Eine Box runter statt zurück auf Box 1. */
function applyTimeout(state, key, budgetMs, now){
  const f=state.facts[key]; if(!f) return;
  f.seen++; f.last=now; f.no++;
  f.rt.push(Math.min(budgetMs,20000)); if(f.rt.length>5) f.rt.shift();
  f.box=Math.max(0,f.box-1);
}
function avgRt(f){ return f.rt.length? Math.round(f.rt.reduce((s,x)=>s+x,0)/f.rt.length) : null; }

function logDay(state, now, addSec, addTasks, addOk){
  const d = todayStr(now);
  const e = state.days[d] || (state.days[d]={sec:0,tasks:0,ok:0});
  e.sec+=addSec; e.tasks+=addTasks; e.ok+=addOk;
}
function bumpStreak(state, now){
  const d=todayStr(now);
  if(state.streak.last===d) return;
  const y=todayStr(now-86400000);
  state.streak.len = (state.streak.last===y)? state.streak.len+1 : 1;
  state.streak.last = d;
}
function masteredCount(state){ return Object.values(state.facts).filter(f=>f.box>=ROW_UNLOCK_MIN_BOX).length; }
function goldCount(state){ return Object.values(state.facts).filter(f=>f.box>=5).length; }

/* ---- Deutsche Zahlwörter 0–100 ---- */
const NUM_UNITS={null:0,eins:1,ein:1,eine:1,zwei:2,zwo:2,drei:3,vier:4,fuenf:5,sechs:6,sieben:7,acht:8,neun:9};
const NUM_TEENS={zehn:10,elf:11,zwoelf:12,dreizehn:13,vierzehn:14,fuenfzehn:15,sechzehn:16,siebzehn:17,achtzehn:18,neunzehn:19};
const NUM_TENS={zwanzig:20,dreissig:30,vierzig:40,fuenfzig:50,sechzig:60,siebzig:70,achtzig:80,neunzig:90};
function normWord(w){ return w.toLowerCase().replace(/ß/g,'ss').replace(/ü/g,'ue').replace(/ö/g,'oe').replace(/ä/g,'ae'); }
function wordToNum(raw){
  const w=normWord(raw);
  if(w in NUM_TEENS) return NUM_TEENS[w];
  if(w in NUM_TENS) return NUM_TENS[w];
  if(w in NUM_UNITS) return NUM_UNITS[w];
  if(w==='hundert'||w==='einhundert') return 100;
  const m=w.match(/^(null|eins?|zwei|zwo|drei|vier|fuenf|sechs|sieben|acht|neun)und(zwanzig|dreissig|vierzig|fuenfzig|sechzig|siebzig|achtzig|neunzig)$/);
  if(m) return NUM_UNITS[m[1]] + NUM_TENS[m[2]];
  return null;
}
/* Alle Zahlen aus einem Transkript (Ziffern und Wörter), in Reihenfolge */
function extractNumbers(text){
  const out=[];
  const tokens = String(text).split(/[^0-9a-zA-ZäöüÄÖÜß]+/).filter(Boolean);
  for(const t of tokens){
    if(/^\d{1,3}$/.test(t)){ const n=parseInt(t,10); if(n<=1000) out.push(n); continue; }
    const n=wordToNum(t); if(n!==null) out.push(n);
  }
  return out;
}
/* Drei Antwort-Tore: richtige Zahl plus zwei Fallen aus derselben Reihe.
   Reihenfolge der Fallen: Nachbarn in der Reihe (a±1)·b, a·(b±1), dann Reihen-Verwechsler,
   erst zuletzt Zahlenstrahl-Nachbarn. So hilft Gerade/Ungerade-Raten nicht. */
function makeOptions(answer,a,b,rng){
  rng=rng||Math.random;
  const tiers=[
    [(a+1)*b,(a-1)*b,a*(b+1),a*(b-1)],
    [(a+2)*b,(a-2)*b,a*(b+2),a*(b-2),(a+1)*(b-1),(a-1)*(b+1)],
    [answer+a,answer-a,answer+b,answer-b,answer+10,answer-10],
    [answer+1,answer-1,answer+2,answer-2]
  ];
  const opts=[answer], seen=new Set([answer]);
  const ok=n=>Number.isInteger(n)&&n>=1&&n<=120&&!seen.has(n);
  // Reihenfolge: Stufe 1 und 2 zuerst mit gleicher Parität wie die Antwort (bei ungeraden
  // Antworten sind das die Zwei-Schritte-Nachbarn), dann der Rest der Stufen
  const sh=tiers.map(t=>t.slice().sort(()=>rng()-0.5));
  const same=n=>n%2===answer%2;
  const ordered=[...sh[0].filter(same), ...sh[1].filter(same), ...sh[0].filter(n=>!same(n)), ...sh[1].filter(n=>!same(n)), ...sh[2].filter(same), ...sh[2].filter(n=>!same(n)), ...sh[3]];
  for(const n of ordered){ if(opts.length>=3) break; if(ok(n)){ seen.add(n); opts.push(n);} }
  let bump=3;
  while(opts.length<3){ const n=answer+bump; if(!seen.has(n)&&n>=1){seen.add(n);opts.push(n);} bump=bump>0?-bump:(-bump+1); }
  return opts.sort(()=>rng()-0.5);
}
/* Reihen-Sprung: "…, 8, 12, ?" – nächste Zahl der Reihe finden */
function seqQuestion(state,rng){
  rng=rng||Math.random;
  const open=unlockedRows(state).filter(r=>r>1);
  const row=open.length?open[Math.min(open.length-1,Math.floor(rng()*open.length))]:2;
  const k=3+Math.floor(rng()*8);              // Position 3..10
  const answer=k*row, shown=[(k-2)*row,(k-1)*row];
  // Fallen: nächster Sprung, gleicher Sprung in der Nachbar-Reihe, übernächster Sprung
  // erste Falle: der übernächste Sprung (bleibt in der Reihe); zweite: Sprung der Nachbar-Reihe oder noch ein Sprung weiter
  const first=[(k+1)*row,(k+2)*row], rest=[k*(row+1), k*(row-1), (k-1)*(row+1), (k+1)*(row-1), (k+3)*row];
  const opts=[answer], seen=new Set([answer,...shown]);
  for(const n of first){ if(opts.length>=2) break; if(n>=1&&n<=120&&!seen.has(n)){seen.add(n);opts.push(n);} }
  for(const n of rest.sort(()=>rng()-0.5)){ if(opts.length>=3) break; if(n>=1&&n<=120&&!seen.has(n)){seen.add(n);opts.push(n);} }
  let bump=3; while(opts.length<3){ const n=answer+bump; if(!seen.has(n)&&n>=1){seen.add(n);opts.push(n);} bump=bump>0?-bump:(-bump+1); }
  return {kind:'seq', row, k, shown, answer, key:factKey(row,k), opts:opts.sort(()=>rng()-0.5)};
}

/* Vorlesen. Selbstheilend, weil jedes Gerät anders zickt:
   - Android-Chrome schweigt, wenn u.voice gesetzt ist und u.lang nicht exakt voice.lang ("de_DE") ist.
   - Android-Chrome bleibt manchmal in "speaking" hängen; dann startet nichts mehr, bis cancel() kommt.
   - Android: pause()/resume() wirken wie Abbruch, darum dort nie aufrufen.
   - iOS und Chrome sprechen erst, nachdem einmal im Fingertipp gesprochen wurde.
   Ablauf: Satz sprechen, auf onstart warten. Kommt nach 1,5 s kein Start, abbrechen und die nächste
   Variante probieren (nur Sprache / feste Stimme mit passender Sprache / ganz ohne Angaben).
   Die Variante, die geklappt hat, wird gespeichert und beim nächsten Mal zuerst genommen. */
const IS_ANDROID=/Android/i.test(navigator.userAgent);

const speechDiag={calls:0, starts:0, retries:0, lastErr:'', lastText:'', mode:speechMode};
function loadVoices(){ try{ const v=speechSynthesis.getVoices(); if(v&&v.length) voices=v; }catch(e){} }
try{ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }catch(e){}
let voicePoll=0; const vp=setInterval(()=>{ loadVoices(); if(voices.length||++voicePoll>20) clearInterval(vp); },250);
function deVoices(){ return voices.filter(v=>/^de([-_]|$)/i.test(v.lang||'')); }
function pickVoice(){
  const de=deVoices(); if(!de.length) return null;
  return de.find(v=>v.localService&&/anna|petra|helena|katja|female|weiblich/i.test(v.name))
      || de.find(v=>v.default) || de.find(v=>v.localService) || de[0];
}
function unlockSpeech(){
  if(speechUnlocked||!('speechSynthesis' in window)) return;
  speechUnlocked=true; loadVoices();
  if(IS_ANDROID) return;                       // Android braucht das nicht, und leere Sätze stören dort eher
  try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='de-DE'; speechSynthesis.speak(u); }catch(e){}
}
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockSpeech,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ try{ speechSynthesis.cancel(); }catch(e){} } });
/* vo: andere Sprecherin (z. B. Kawumm): {rate, pitch, alt}. alt = im Weg 'voice' eine zweite deutsche Stimme nehmen, falls das Gerät eine hat. */
function altVoice(){ const de=deVoices(), main=pickVoice(); return de.find(v=>v!==main&&v.localService) || de.find(v=>v!==main) || main; }
function makeUtt(text,mode,vo){
  const u=new SpeechSynthesisUtterance(text);
  u.rate=(vo&&vo.rate)||1.04; u.pitch=(vo&&vo.pitch)||1.14; u.volume=1;
  if(mode==='lang'){ u.lang='de-DE'; }
  else if(mode==='voice'){ const v=(vo&&vo.alt)?altVoice():pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang='de-DE'; }
  return u;                                     // 'plain': gar nichts setzen, Gerätestandard
}
function speak(text, cb, vo){
  let done=false; const fire=()=>{ if(done) return; done=true; cb&&cb(); };
  if(!S.sound || !('speechSynthesis' in window) || !text){ fire(); return; }
  const my=++speakSeq; speechDiag.calls++; speechDiag.lastText=String(text).slice(0,60);
  const ss=window.speechSynthesis;
  let busy=false; try{ busy=ss.speaking||ss.pending; if(busy) ss.cancel(); }catch(e){}
  if(cb) setTimeout(fire, Math.max(3000, String(text).length*120)+1600);
  const order=[speechMode].concat(SPEECH_MODES.filter(m=>m!==speechMode));
  const go=(i)=>{
    if(my!==speakSeq){ fire(); return; }        // ein neuerer Satz hat übernommen
    if(i>=order.length){ fire(); return; }
    const mode=order[i]; let started=false, failed=false;
    const next=()=>{ if(failed||started||my!==speakSeq) return; failed=true; speechDiag.retries++; try{ ss.cancel(); }catch(e){} setTimeout(()=>go(i+1),150); };
    try{
      const u=makeUtt(text,mode,vo);
      u.onstart=()=>{ started=true; speechDiag.starts++; speechDiag.mode=mode;
        if(speechMode!==mode){ speechMode=mode; try{ localStorage.setItem('einhorn_speechMode',mode); }catch(e){} } };
      u.onend=fire;
      u.onerror=e=>{ const err=(e&&e.error)||'?'; speechDiag.lastErr=err+' ('+mode+')';
        if(err==='interrupted'||err==='canceled'){ if(!started&&my===speakSeq) next(); else fire(); return; }
        started?fire():next(); };
      curUtt=u;                                   // Referenz halten, sonst räumt Chrome sie weg
      if(!IS_ANDROID){ try{ ss.resume(); }catch(e){} }
      ss.speak(u);
      setTimeout(()=>{ if(!started) next(); },1500);
    }catch(e){ speechDiag.lastErr=String(e&&e.message||e); next(); }
  };
  // nach cancel() kurz warten, sonst verschluckt Chrome den neuen Satz
  setTimeout(()=>go(0), busy?150:0);
}

function tone(freq,dur,when,type,gain){

    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+when+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(AC.currentTime+when); o.stop(AC.currentTime+when+dur+0.05);
  }catch(e){}
}

/* ---------- Spracherkennung ---------- */
const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let srBlocked = !SRClass;
let srErrTimes=[];   // Bremse gegen Fehler-Schleifen: 4 Fehler in 6 s → Mikro für diese Sitzung aus
function srErrorStorm(){
  const now=Date.now();
  srErrTimes=srErrTimes.filter(t=>now-t<6000); srErrTimes.push(now);
  if(srErrTimes.length>=4){ srBlocked=true; return true; }
  return false;
}
function makeRec(onNums, onEnd){
  if(!SRClass || srBlocked) return null;
  let rec;
  try{ rec=new SRClass(); }catch(e){ srBlocked=true; return null; }
  rec.lang='de-DE'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=3;
  rec.onresult=(ev)=>{
    let txt='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      for(let j=0;j<ev.results[i].length;j++) txt+=' '+ev.results[i][j].transcript;
    }
    const nums=extractNumbers(txt);
    if(nums.length) onNums(nums, ev.results[ev.results.length-1].isFinal);
  };
  rec.onerror=(ev)=>{
    if(['not-allowed','service-not-allowed','audio-capture'].includes(ev.error)){ srBlocked=true; }
    else srErrorStorm();
    onEnd&&onEnd(ev.error);
  };
  rec.onend=()=>{ onEnd&&onEnd(null); };
  return rec;
}

/* ---------- FX: Konfetti + Regenbogen ---------- */
const fx=document.getElementById('fx'), fctx=fx.getContext('2d');
let parts=[], fxRun=false;
function fxSize(){ fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio; }
addEventListener('resize',fxSize); fxSize();
const RB=['#F96D6D','#F8A34D','#F2CE4B','#4FC47F','#58A6F0','#9A6AE8','#E06FB4'];
function burst(n,xr,yr,power){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) n=Math.min(n,12);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=(0.4+Math.random())*power;
    parts.push({x:xr*fx.width, y:yr*fx.height, vx:Math.cos(a)*v, vy:Math.sin(a)*v-power*0.6,
      g:0.08*devicePixelRatio, r:(3+Math.random()*5)*devicePixelRatio, c:RB[i%RB.length],
      rot:Math.random()*6, vr:(Math.random()-0.5)*0.3, life:80+Math.random()*50, shape:Math.random()<0.25?'star':'rect'});
  }
  if(!fxRun){ fxRun=true; requestAnimationFrame(fxStep); }
}
function fxStep(){
  fctx.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    p.x+=p.vx*devicePixelRatio; p.y+=p.vy*devicePixelRatio; p.vy+=p.g; p.rot+=p.vr; p.life--;
    fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.rot); fctx.fillStyle=p.c;
    fctx.globalAlpha=Math.min(1,p.life/30);
    if(p.shape==='star'){ starPath(fctx,p.r); fctx.fill(); } else fctx.fillRect(-p.r/2,-p.r,p.r,p.r*2);
    fctx.restore();
  }
  if(parts.length){ requestAnimationFrame(fxStep); } else { fxRun=false; fctx.clearRect(0,0,fx.width,fx.height); }
}
function starPath(c,r){ c.beginPath(); for(let i=0;i<10;i++){ const rr=i%2?r/2:r, a=i*Math.PI/5-Math.PI/2; c[i?'lineTo':'moveTo'](Math.cos(a)*rr,Math.sin(a)*rr);} c.closePath(); }
function smallSparkle(){ burst(14,0.5,0.4,6); }
function bigKnall(){ burst(90,0.5,0.55,13); setTimeout(()=>burst(60,0.2,0.4,10),250); setTimeout(()=>burst(60,0.8,0.4,10),450); }

const CTA_WAIT=1500;
function armCTAs(root, ms){
  if(!root) return;

let R=null;            // aktuelle Runde
let rec=null, recWanted=false;
function stopAllRec(){ recWanted=false; try{ rec&&rec.stop(); }catch(e){} rec=null; setMicUI(); }

function startPractice(){
  R={mode:'practice', i:0, n:S.tasksPerRound, ok:0, redo:[], recent:[], input:'', locked:false, task:null, t0:0, starsBefore:S.stars};
  bumpStreak(S,Date.now());
  buildPad($('pad'),padKey);

function nextTask(){
  if(!R) return;
  if(R.i>=R.n && R.redo.length===0){ finishPractice(); return; }
  // fällige Wiederholung einer eben verfehlten Aufgabe?
  const redoIdx=R.redo.findIndex(x=>x.after<=R.i);
  if(redoIdx>=0 && (R.i<R.n || true)){ R.task=R.redo.splice(redoIdx,1)[0].task; }
  else if(R.i<R.n){ R.task=pickTask(S,R.recent,Date.now()); R.recent.push(R.task.key); if(R.recent.length>4) R.recent.shift(); }
  else { R.task=R.redo.splice(0,1)[0].task; }
  R.input=''; R.locked=false; R.t0=performance.now();
  renderTask();
  // Mikro erst nach dem Vorlesen starten, sonst hört es die eigene Aufgabe
  speak('Wie viel ist '+R.task.say+'?', ()=>startAnswerRec());
}
function renderTask(){
  const dots=$('pDots'); dots.innerHTML='';
  for(let i=0;i<R.n;i++){ const d=document.createElement('span'); d.className='pdot'+(i<R.i?' done':i===R.i?' now':''); dots.appendChild(d); }
  $('qLeft').textContent=R.task.show;
  renderInput(); $('qFeedback').textContent=''; $('qFeedback').className='feedback';
  $('qDots').innerHTML='';
}
function renderInput(){
  const a=$(R.mode==='blitz'?'bAns':'qAns');
  a.textContent=R.input||'?';
  a.classList.toggle('empty',!R.input);
}
function padKey(k){ handleKey(k,false); }
function handleKey(k,blitz){
  if(!R||R.locked) return;
  if(k==='⌫'){ R.input=R.input.slice(0,-1); }
  else if(k==='✓'){ if(R.input) submit(parseInt(R.input,10)); return; }
  else { if(R.input.length<3) R.input+=k; if(parseInt(R.input,10)===R.task.answer && String(R.task.answer).length===R.input.length){ submit(R.task.answer); return; } }
  renderInput();
}
function submit(val){
  if(!R||R.locked) return;
  R.locked=true; stopAnswerRec();
  const rt=performance.now()-R.t0;
  const good = val===R.task.answer;
  applyResult(S,R.task.key,good,rt,Date.now());
  logDay(S,Date.now(),0,1,good?1:0);
  const fb=$(R.mode==='blitz'?'bFeedback':'qFeedback');
  R.input=String(val); renderInput();
  let wait;
  if(good){
    R.ok++; S.stars++; $('starCount')&&($('starCount').textContent=S.stars);
    fb.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)]; fb.className='feedback good pop';
    sndGoodN(R.ok);
    if(R.mode==='blitz'){ $('blitzCount').textContent=R.ok; starFly($('bAns'),$('blitzCount').parentElement); }
    else{
      smallSparkle();
      starFly($('qAns'), document.querySelector('.pdot.now')||$('pDots'));
      const ml=$('miniLumi'); if(ml){ ml.classList.remove('hop'); void ml.offsetWidth; ml.classList.add('hop'); }
    }
    wait=850;
  }else{
    fb.textContent='Fast! '+R.task.show+' = '+R.task.answer; fb.className='feedback again';
    sndAgain();
    wait=1600;
    if(R.mode==='practice'){
      speak(R.task.say+' ist '+R.task.answer+'. Gleich nochmal!');
      R.redo.push({task:{...R.task}, after:R.i+2});
      // Punktefeld zeigen: so sieht man, warum das Ergebnis stimmt
      const t=R.task, r=Math.min(t.a,t.b), c=Math.max(t.a,t.b);
      const rowsWord = r===1 ? '1 Reihe' : r+' Reihen';
      const dotsWord = c===1 ? 'mit 1 Punkt' : (r===1?'mit ':'mit je ')+c+' Punkten';
      if(t.type==='mul') renderDots($('qDots'), r, c, rowsWord+' '+dotsWord+' = '+t.answer);
      else renderDots($('qDots'), Math.min(t.answer,t.b), Math.max(t.answer,t.b), (t.a===1?'1 Punkt':t.a+' Punkte')+' = '+t.answer+' · '+t.b);
      wait=3400;
    }
  }
  save();
  R.i++;
  setTimeout(()=>{ if(R) R.mode==='blitz'? nextBlitzTask() : nextTask(); }, wait);
}
function finishPractice(){

/* Geschenke für Lumi: Bei jedem Meilenstein darf das Kind zwischen zwei Extras wählen.
   Kein Laden, keine Preise. Die Wahl liegt immer bei den Extras mit der niedrigsten Stufe,
   damit alles nach und nach wächst und nichts "fertig" ist. */
function pendingRewards(){ return Math.max(0, rewardsEarned(S.stars)-(S.rewards||0)); }
function starsToNextGift(){ let need=0; for(let m=0;m<ITEMS.length*MAX_LEVEL;m++){ need+=rewardCost(m); if(m>=(S.rewards||0)) return Math.max(0,need-S.stars); } return null; }
function rewardOptions(){
  const open=ITEMS.filter(it=>(S.gear[it.id]||0)<MAX_LEVEL);
  if(!open.length) return [];
  const min=Math.min(...open.map(it=>S.gear[it.id]||0));
  return open.filter(it=>(S.gear[it.id]||0)===min).sort(()=>Math.random()-0.5).slice(0,2);
}

}
function claimGift(it){

/* Mikro für Einzelantworten */
function startAnswerRec(){
  if(srBlocked||!R) { setMicUI(); return; }
  recWanted=true;
  rec=makeRec((nums,isFinal)=>{
    if(!R||R.locked) return;
    if(nums.includes(R.task.answer)){ submit(R.task.answer); return; }
    // Aufgabenzahlen (z. B. "sechs mal sieben" nachgesprochen) nicht als Antwort werten
    const cand=nums.filter(n=>n!==R.task.a&&n!==R.task.b);
    if(isFinal && cand.length){ submit(cand[cand.length-1]); }
  },(err)=>{
    if(srBlocked){ setMicUI(); return; }
    if(recWanted){ setTimeout(()=>{ if(recWanted&&!srBlocked){ try{ rec&&rec.start(); }catch(e){} } },250); }  // iOS beendet gern: sanft neu starten
  });

}

let RD=null, rideTick=null;
function startRide(row){
  RD={row, idx:0, t0:performance.now(), done:false, input:'', errors:0};

    ()=>{ if(!RD) return; RD.t0=performance.now(); if(!srBlocked) startRideRec(); });
}
function rideKey(k){
  if(!RD||RD.done) return;
  const expect=(RD.idx+1)*RD.row;
  if(k==='⌫'){ RD.input=RD.input.slice(0,-1); renderRideInput(); return; }
  if(k==='✓'){ if(RD.input) rideSubmit(parseInt(RD.input,10)); return; }
  if(RD.input.length<3) RD.input+=k;
  if(parseInt(RD.input,10)===expect && String(expect).length===RD.input.length){ rideSubmit(expect); return; }
  renderRideInput();
}
function rideSubmit(val){
  const expect=(RD.idx+1)*RD.row;
  if(val===expect){ RD.input=''; sndGood(); rideAdvance(); }
  else{
    RD.errors++; RD.input=''; sndAgain();
    const c=document.querySelector('.cloud.next');
    if(c){ c.classList.add('wiggle'); setTimeout(()=>c&&c.classList.remove('wiggle'),650); }
    renderRideInput();
  }
}
function renderRideInput(){
  const c=document.querySelector('.cloud.next .v');
  if(c) c.textContent=RD.input||'?';
}
$('btnRideBack').addEventListener('click',()=>{ stopRide(); openIsland(RD?RD.row:ISL); });
$('btnRideMic').addEventListener('click',()=>{ if(recWanted){ stopAllRec(); } else startRideRec(); setRideMicUI(); });
function renderRide(){
  const g=$('rideGrid'); g.innerHTML='';
  for(let i=1;i<=10;i++){
    const d=document.createElement('div');
    const doneC=i<=RD.idx, next=i===RD.idx+1;
    d.className='cloud'+(doneC?' done':'')+(next?' next':'');
    const val = doneC ? (i*RD.row) : (next ? (RD.input||'?') : '·');
    d.innerHTML='<span class="q">'+i+' · '+RD.row+'</span><span class="v">'+val+'</span>';
    g.appendChild(d);
  }
  setRideMicUI();
}
function rideAdvance(){
  if(!RD||RD.done) return;
  RD.idx++; RD.input='';
  if(RD.idx>=10) finishRide(); else { renderRide(); }
}
function startRideRec(){
  if(srBlocked) { setRideMicUI(); return; }
  recWanted=true;
  rec=makeRec((nums)=>{
    if(!RD||RD.done) return;
    let moved=false;
    for(const n of nums){
      const expect=(RD.idx+1)*RD.row;
      if(n===expect){ RD.idx++; RD.input=''; moved=true; if(RD.idx>=10){ finishRide(); return; } }
    }
    if(moved){ sndGood(); renderRide(); }
  },()=>{ if(recWanted&&!srBlocked){ setTimeout(()=>{ if(recWanted&&!srBlocked){ try{ rec&&rec.start(); }catch(e){} } },250); } else setRideMicUI(); });
  try{ rec.start(); }catch(e){ srBlocked=true; }
  setRideMicUI();
}
function setRideMicUI(){
  const l=$('rideMicLine');
  if(srBlocked){ l.classList.remove('listening'); $('rideMicText').textContent=''; $('btnRideMic').style.display='none'; }
  else if(recWanted){ l.classList.add('listening'); $('rideMicText').textContent='Ich höre zu …'; }
  else { l.classList.remove('listening'); $('rideMicText').textContent='Mikro ist aus'; }
}
function stopRide(){ RD=null; clearInterval(rideTick); stopAllRec(); }
function finishRide(){
  RD.done=true; stopAllRec(); clearInterval(rideTick);
  const ms=performance.now()-RD.t0;
  const prev=S.best.rows[RD.row];
  const clean=RD.errors===0;
  const record=clean && (!prev||ms<prev);
  if(record) S.best.rows[RD.row]=Math.round(ms);
  // Ritt zählt als leichte Übung für die ganze Reihe
  for(let b=1;b<=10;b++){ const f=S.facts[factKey(RD.row,b)]; f.seen++; f.ok++; f.last=Date.now(); if(f.box<2) f.box++; }
  S.stars+=3; logDay(S,Date.now(),0,10,10);
  const unlockedItem=checkItemUnlock();
  save();
  renderRide();
  const row=RD.row, errs=RD.errors; RD=null;

/* ---------- Sternschnuppe (Blitzrunde) ---------- */
let BZ=null, bzTick=null;
function startBlitz(){
  BZ={t0:0, dur:60000, count:0};
  R={mode:'blitz', i:0, n:999, ok:0, redo:[], recent:[], input:'', locked:false, task:null, t0:0};
  bumpStreak(S,Date.now());
  buildPad($('bPad'),k=>handleKey(k,true));
  $('blitzCount').textContent='0';
  $('blitzBar').style.width='100%';
  $('bLeft').textContent='…'; $('bAns').textContent='?'; $('bAns').classList.add('empty');
  show('blitz');
  // Uhr startet erst nach der Ansage, damit keine Zeit verloren geht
  speak('Sternschnuppen-Runde! Eine Minute. Los!', ()=>{
    if(!BZ) return;
    BZ.t0=performance.now();
    clearInterval(bzTick);
    bzTick=setInterval(()=>{
      if(!BZ||!BZ.t0) return;
      const left=Math.max(0,BZ.dur-(performance.now()-BZ.t0));
      $('blitzBar').style.width=(left/BZ.dur*100)+'%';
      if(left<=0) finishBlitz();
    },100);
    nextBlitzTask();
  });
}
function nextBlitzTask(){
  if(!BZ) return;
  // Nur geübte Fakten (Box>=2), damit es flutscht
  let task=null;
  for(let tries=0;tries<20;tries++){
    const t=pickTask(S,R.recent,Date.now());
    if(S.facts[t.key].box>=2||tries===19){ task=t; break; }
  }
  R.task=task; R.recent.push(task.key); if(R.recent.length>4) R.recent.shift();
  R.input=''; R.locked=false; R.t0=performance.now();
  $('bLeft').textContent=task.show; renderInput();
  $('bFeedback').textContent=''; $('bFeedback').className='feedback';
  startAnswerRec();
}
function finishBlitz(){
  clearInterval(bzTick); stopAllRec();
  if(!BZ) return;
  const count=R?R.ok:0;
  const record=count>S.best.blitz;
  if(record) S.best.blitz=count;
  const unlockedItem=checkItemUnlock();
  save();
  BZ=null; R=null;
  $('unicornEnd').innerHTML=unicornSVG(S.gear,170);
  $('endTitle').textContent=record?'Neuer Rekord! 🌠':'Zeit um!';
  $('endStars').textContent=plural(count,'Sternschnuppe','Sternschnuppen')+' gefangen';
  $('endDetail').textContent=record?'Dein bester Lauf!':'Rekord: '+S.best.blitz;
  $('btnAgain').textContent='Nochmal!';
  $('btnAgain').onclick=()=>startBlitz();
  show('end');
  if(record){ bigKnall(); sndFanfare(); } else { burst(40,0.5,0.5,9); }
  speak(record?'Wahnsinn! Neuer Rekord: '+count+'!':'Zeit um! '+plural(count,'Sternschnuppe','Sternschnuppen')+'!');
  if(unlockedItem) setTimeout(()=>showItemOverlay(unlockedItem),1400);
}

const RUN_GATES=12;
const WORLD_INFO={

function masteredFriends(){ return ROW_ORDER.filter(r=>rowMastery(S,r)>=ROW_UNLOCK_SHARE).map(r=>FRIENDS[r]); }
function shuffleArr(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const G=()=>window.Wolkenritt;

async function startRun(){
  const eng=G();

function renderRunDots(){

function planFor(t){

  return gatePlan(factStage(S.facts[t.key]), S.facts[t.key]);
}

function sndBrake(){ tone(520,.16,0,'triangle',.12); tone(390,.16,.12,'triangle',.12); tone(290,.26,.24,'triangle',.12); }
function sndWorld(){ [659,784,988].forEach((f,i)=>tone(f,.18,i*0.11)); }

function nextGate(){
  if(!RN) return;
  const eng=G();
  if(RN.gate>=RN.n){ finishRun(); return; }
  renderRunDots();
  const roll=Math.random();
  const isWorldGate = (RN.gate%4===3) && RN.gate<RN.n-1;
  let t, riddle=false;
  const redoIdx=RN.redo.findIndex(x=>x.after<=RN.gate);
  if(redoIdx>=0 && !isWorldGate){
    // dieselbe Aufgabe noch einmal, kurz nach dem Fehler
    const r=RN.redo.splice(redoIdx,1)[0];
    t={kind:'fact', key:r.key, answer:r.answer, opts:makeOptions(r.answer,r.a,r.b), show:r.show, a:r.a, b:r.b};
    setQ('Nochmal! Du schaffst das:', r.show+' = ?');
  }else if(!isWorldGate && RN.gate>=2 && roll<0.22){
    t=friendRiddle(S, Math.random, RN.friends); riddle=true;
    setQ('Der Ritt hält an …',''); $('runQ').querySelector('.qchip').style.display='none';
  }else if(!isWorldGate && roll<0.45){
    // Reihen-Sprung nie am Weltentor: das Tor braucht eine Malaufgabe mit Text
    t=seqQuestion(S);
    setQ('Lumi springt in '+t.row+'er-Sprüngen!','… '+t.shown[0]+' … '+t.shown[1]+' … <b style="color:var(--accent)">?</b>');
  }else{
    let p=null;
    for(let i=0;i<10;i++){ p=pickTask(S,RN.recent,Date.now()); if(p.type==='mul') break; }
    if(p.type!=='mul'){ const pr=p.key.split('x').map(Number); p={key:p.key,a:pr[0],b:pr[1],show:pr[0]+' · '+pr[1],answer:pr[0]*pr[1]}; }
    t={kind:'fact', key:p.key, answer:p.answer, opts:makeOptions(p.answer,p.a,p.b), show:p.show, a:p.a, b:p.b};
    RN.recent.push(p.key); if(RN.recent.length>4) RN.recent.shift();
    setQ('Durch welches Tor, Lumi?', p.show+' = ?');
  }
  RN.task=t; RN.locked=false; RN.riddle=riddle; RN.isWorldGate=isWorldGate; RN.t0=performance.now();
  if(isWorldGate){
    // Vor dem Weltentor anhalten: Türen zu, Aufgabe hängt am Tor
    const next=RN.worlds[RN.wIdx+1];
    setQ('Das Weltentor ist zu! Löse die Aufgabe, dann geht es auf.', t.show+' = ?');
    eng.brake(); sndBrake();
    eng.worldGate(t.opts, next);
    speak('Halt! Das Weltentor ist zu. Wie viel ist '+t.show.replace('·','mal')+'?');
    return;
  }
  if(riddle){
    // Brems-Inszenierung: Lumi bremst, Tore stehen vor dir, Freund schwebt ein
    eng.brake(); sndBrake();
    eng.spawnGates(t.opts,{hold:true});
    setTimeout(()=>{ if(!RN||!RN.riddle) return;
      showFriend(t.icon, t.text, t.pic);
      speak(t.name+' fragt: '+t.text.replace(/^[^:]*:\s*/,'').replace(/[„“]/g,''));
      RN.t0=performance.now();
    },700);
  }else{
    const plan=planFor(t); RN.plan=plan;
    if(plan.stage==='neu' && t.kind==='fact' && S.facts[t.key].seen===0){ setQ('Neue Aufgabe, lass dir Zeit!', t.show+' = ?'); }
    eng.spawnGates(t.opts,Object.assign({worldgate:isWorldGate, onWaitLong:()=>{ if(RN&&!RN.locked) speak('Die Tore warten auf dich. Schau sie dir in Ruhe an.'); }},plan));
  }
}

async function chooseGate(val, lane){
  if(!RN||RN.locked) return;
  RN.locked=true;
  const eng=G();
  const t=RN.task, rt=performance.now()-RN.t0, good=val===t.answer;
  const goodLane=t.opts.indexOf(t.answer);
  if(val===null) applyTimeout(S, t.key, (RN.plan&&RN.plan.approachMs)||9000, Date.now());
  else applyResult(S, t.key, good, rt, Date.now());
  logDay(S,Date.now(),0,1,good?1:0);
  if(RN.first && RN.gate===0) hideFriend();
  const wasRiddle=RN.riddle, wasWorldGate=RN.isWorldGate;
  if(good){
    RN.ok++; RN.combo++; RN.bestCombo=Math.max(RN.bestCombo,RN.combo);
    let gained=1; if(RN.combo%4===0){ gained=2; burst(30,0.5,0.3,8); }
    RN.stars+=gained; S.stars+=gained;
    $('runStars').textContent=RN.stars;
    $('comboN').textContent=RN.combo; $('comboBar').style.width=Math.min(100,RN.combo*12.5)+'%';
    $('comboChip').classList.toggle('hot',RN.combo>=3);
    sndGoodN(RN.combo);
    if(wasRiddle){
      friendSay('Juhu! Genau richtig! 🎉'); friendHop();
      S.friendsMet=S.friendsMet||{}; S.friendsMet[t.name]=(S.friendsMet[t.name]||0)+1;
      if(!RN.metFriends.some(f=>f[1]===t.name)) RN.metFriends.push([t.icon,t.name]);
    }
  }else{
    RN.combo=0; $('comboN').textContent='0'; $('comboBar').style.width='0%'; $('comboChip').classList.remove('hot');
    sndAgain();
    const sayIt = t.kind==='seq' ? 'Nach '+t.shown[1]+' kommt '+t.answer+'.' : (t.show? t.show.replace('·','mal')+' ist '+t.answer+'.' : 'Es sind '+t.answer+'.');
    const msg = (val===null ? 'Hui, vorbeigeritten! ' : 'Fast! ')+(t.show? t.show+' = '+t.answer : 'Es war '+t.answer);
    if(wasRiddle){ friendSay('Macht nix! Es sind '+t.answer+'.'); }
    else setQ(msg,'');
    if(!wasWorldGate) speak(sayIt);
    if(t.kind==='fact' && t.show) RN.redo.push({key:t.key, answer:t.answer, a:t.a, b:t.b, show:t.show, after:RN.gate+3});
  }
  eng.setCombo(RN.combo);
  save();
  RN.gate++;
  if(wasWorldGate){
    // Weltentor: Türen auf, Blick in die neue Welt, Durchritt, dann wechselt der Himmel
    const w=RN.worlds[RN.wIdx+1];
    if(good) speak('Das Tor geht auf! '+WORLD_INFO[w].willk.replace('-',' '));
    else speak(t.show.replace('·','mal')+' ist '+t.answer+'. Das Tor geht trotzdem auf!');
    await eng.resolveWorldGate({goodLane, pickedLane:lane, good, onOpen:()=>sndWorld()});
    if(!RN) return;
    RN.wIdx++;
    eng.changeWorld(w); worldBannerShow(w); sndWorld();
    if(good){ eng.collectStar(); pling(); }
    await wait(1500); if(!RN) return;
    nextGate(); return;
  }
  if(wasRiddle){
    await wait(good?900:1500); if(!RN) return;
    hideFriend(); eng.launch(); sndWorld();
    eng.resumeGates(1100);
    await wait(1100); if(!RN) return;
  }
  await eng.resolve({goodLane, pickedLane:lane, good, worldgate:false});
  if(!RN) return;
  if(good){ eng.collectStar(); pling(); }
  await wait(good?350:900); if(!RN) return;
  nextGate();
}
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

function finishRun(){

const ANIMAL_LINES={
  wait:['Hallo! Ich bin {n}. Übst du die {r}er-Reihe mit mir? Tipp mich an, dann sag ich dir, was noch fehlt.','Psst, ich warte hier auf dich. Schaffst du die {r}er-Reihe?','Die {r}er-Reihe macht mich ganz müde. Hilfst du mir?'],
  awake:['Juhu, du bist da! Die {r}er-Reihe kannst du schon! Tipp mich an, dann verrate ich dir die nächste Insel.','Reiten wir noch eine Runde? Ich liebe den Inselritt!','Schau dir meine Insel an! Hast du Sterne für etwas Neues?']
};
function islandLine(r){

  return pool[Math.floor(Math.random()*pool.length)].replace('{n}',FRIENDS[r][1]).replace('{r}',r);
}
/* Was fehlt bis zur nächsten Insel? Kindgerecht, mit Spieltipp. Wird gesagt, wenn man das Tier antippt.
   Regel: Die neueste offene Insel braucht 8 lila Sterne (Aufgaben in Box 3+), dann taucht die nächste auf.
   Lila wird eine Aufgabe nur durch eine SCHNELLE richtige Antwort, darum der Tipp je nach Stand. */
function nextIslandLine(r){
  const open=unlockedRows(S), cur=open[open.length-1], next=nextLockedRow(S);
  if(next===null) return pickOne(['Alle Inseln sind schon offen! Jetzt kannst du alle Sterne golden machen.','Du hast alle Inseln geweckt! Schaffst du es, dass alle Sterne golden leuchten?']);
  const facts=rowFacts(S,cur), need=Math.ceil(ROW_UNLOCK_SHARE*10);
  const sure=facts.filter(f=>f.box>=ROW_UNLOCK_MIN_BOX).length, rest=Math.max(1,need-sure);
  const neu=facts.filter(f=>f.seen===0).length;
  const wackelt=facts.filter(f=>f.seen>0&&f.box<=1).length;
  const fast=facts.filter(f=>f.box===2).length;
  const nextName='die '+next+'er-Insel', nextFriend=FRIENDS[next][1];
  const where = r===cur ? 'auf meiner Insel' : 'auf der '+cur+'er-Insel';
  let tip;
  if(neu>=3) tip = r===cur ? 'Tipp: Reite den Inselritt hier bei mir. Da lernst du die ganze '+cur+'er-Reihe kennen.' : 'Tipp: Flieg zur '+cur+'er-Insel und reite dort den Inselritt.';
  else if(wackelt>=fast && wackelt>0) tip='Tipp: Spiel das Zaubertraining. Da übst du ganz in Ruhe die Aufgaben, die noch wackeln.';
  else tip='Tipp: Spiel den Wolkenflug und antworte ganz schnell aus dem Kopf. Dann werden die Sterne lila.';
  const almost = fast>0 && fast>=rest ? ' Bei '+plural(fast,'Aufgabe','Aufgaben')+' fehlt nur noch eine schnelle Antwort!' : '';
  const head = rest===1
    ? pickOne(['Nur noch 1 lila Stern '+where+', dann taucht '+nextName+' auf!','Fast geschafft! Noch 1 lila Stern '+where+', dann kommt '+nextName+'.'])
    : pickOne(['Noch '+rest+' lila Sterne '+where+', dann taucht '+nextName+' auf!','Weißt du was? Mit '+rest+' lila Sternen mehr '+where+' wacht '+nextName+' auf.']
        .concat(sure>0?['Du hast schon '+sure+' von '+need+' lila Sternen '+where+'. Bei '+need+' taucht '+nextName+' auf!']:[]));
  const friend = r===cur ? ' Dort wartet '+nextFriend+'.' : '';
  const done = r!==cur ? pickOne(['Meine Insel leuchtet schon, danke! ','Mich hast du schon geweckt! ']) : '';
  return done+head+friend+almost+' '+tip;
}
function pickOne(a){ return a[Math.floor(Math.random()*a.length)]; }
function openIsland(r){
  const W=IW(); ISL=r;
  const mastered=rowMastery(S,r)>=ROW_UNLOCK_SHARE;
  $('islTitle').textContent=r+'er · '+W.ISLANDS[r].title;
  $('islStarCount').textContent=starsAvail();
  $('islStage').innerHTML=W.islandSVG(r,{open:true, mastered, built:islandBuilt(r), animate:true, size:420});
  const line=islandLine(r);
  $('islBubble').textContent=line;
  const facts=rowFacts(S,r), sure=facts.filter(f=>f.box>=3).length;
  $('islProgress').innerHTML=facts.map(f=> f.box>=5?starSVG('#F2B83C') : f.box>=3?starSVG('#9A6AE8') : f.seen>0?starSVG('#D9CFF0'):starSVG('#EEE8F8')).join('')+'<span style="margin-left:6px">'+(()=>{ const op=unlockedRows(S), nx=nextLockedRow(S); return (r===op[op.length-1]&&nx!==null)? Math.min(sure,8)+' von 8 für die '+nx+'er-Insel' : sure+' von 10 sicher'; })()+(S.best.rows[r]?' · Rekord '+(S.best.rows[r]/1000).toFixed(1).replace('.',',')+' s':'')+'</span>';
  const an=$('islStage').querySelector('.isl-animal');
  if(an){ an.style.cursor='pointer'; an.addEventListener('click',()=>{ an.classList.remove('hop'); void an.getBBox(); an.classList.add('hop'); smallSparkle(); sndGood(); const t=nextIslandLine(r); $('islBubble').textContent=t; speak(t); }); }
  renderShop(r);
  if(window.KW) KW.islandCard(r);
  show('island');
  speak(line);
}
function renderShop(r){
  const W=IW(), built=islandBuilt(r), avail=starsAvail(), el=$('islShop'); el.innerHTML='';
  W.ISLANDS[r].builds.forEach((id,i)=>{
    const cost=W.BUILD_COST[i], has=built.includes(id);
    const d=document.createElement('div'); d.className='shopcard';
    d.innerHTML=W.buildIconSVG(id,56)+'<div class="nm">'+W.BUILDS[id].name+'</div>'
      +(has?'<button class="shopbtn done" disabled>Gebaut ✓</button>'
          :'<button class="shopbtn" '+(avail>=cost?'':'disabled')+' data-id="'+id+'" data-cost="'+cost+'">'+STAR_SVG.replace('width="30" height="30"','')+' '+cost+'</button>'+(avail>=cost?'':'<div class="needmore">noch '+(cost-avail)+'</div>'));
    el.appendChild(d);
  });
  el.querySelectorAll('.shopbtn[data-id]').forEach(b=>b.addEventListener('click',()=>buyBuild(r,b.dataset.id,+b.dataset.cost)));
  const todo=starsToNextGift();
  $('islGiftLine').textContent = todo===null?'' : '🎁 Bauen kostet keine Geschenk-Sterne. Noch '+plural(todo,'Stern','Sterne')+' bis zum nächsten Geschenk für Lumi.';
}
function buyBuild(r,id,cost){
  if(starsAvail()<cost) return;
  S.spent=(S.spent||0)+cost;
  S.islands=S.islands||{}; S.islands[r]=islandBuilt(r).concat([id]);
  save();
  const W=IW(), mastered=rowMastery(S,r)>=ROW_UNLOCK_SHARE;
  $('islStage').innerHTML=W.islandSVG(r,{open:true, mastered, built:islandBuilt(r), animate:true, size:420});
  const bs=$('islStage').querySelectorAll('.isl-build'); const last=bs[bs.length-1]; if(last) last.classList.add('pop');
  const an=$('islStage').querySelector('.isl-animal'); if(an){ an.classList.add('hop'); }
  $('islStarCount').textContent=starsAvail(); $('starCount').textContent=S.stars;
  burst(40,0.5,0.35,9); sndFanfare();
  const t=W.BUILDS[id].name+'! '+FRIENDS[r][1]+' freut sich riesig!';
  $('islBubble').textContent=t; speak(t);
  renderShop(r);
}

/* ---------- Elternbereich ---------- */
let gateAns=0;
function openGate(){
  const a=12+Math.floor(Math.random()*8), b=13+Math.floor(Math.random()*9);
  gateAns=a*b; $('gateQ').textContent=a+' · '+b; $('gateIn').value='';
  show('gate');
}
$('gateOk').addEventListener('click',()=>{ if(parseInt($('gateIn').value,10)===gateAns){ renderParent(); show('parent'); } else { $('gateIn').value=''; $('gateIn').placeholder='Hm, nein'; } });
$('gateIn').addEventListener('keydown',e=>{ if(e.key==='Enter') $('gateOk').click(); });

function fmtMin(sec){ return Math.round(sec/60)+' min'; }
function renderParent(){
  const w=$('parentWrap');
  const days=[]; const now=Date.now();
  for(let i=13;i>=0;i--){ const d=todayStr(now-i*86400000); days.push({d, e:S.days[d]||{sec:0,tasks:0,ok:0}}); }
  const maxSec=Math.max(60,...days.map(x=>x.e.sec));
  const tasks7=days.slice(7).reduce((s,x)=>s+x.e.tasks,0), ok7=days.slice(7).reduce((s,x)=>s+x.e.ok,0);
  const totalSec=Object.values(S.days).reduce((s,e)=>s+e.sec,0);
  const mastered=masteredCount(S), gold=goldCount(S);
  const fastFacts=Object.values(S.facts).filter(f=>f.box>=3&&f.rt.length);
  const avgFast=fastFacts.length? (fastFacts.reduce((s,f)=>s+avgRt(f),0)/fastFacts.length/1000).toFixed(1):'–';

  let heat='<div class="heat"><div class="h"></div>';
  for(let b=1;b<=10;b++) heat+='<div class="h">·'+b+'</div>';
  for(const r of ROW_ORDER.slice().sort((a,b)=>a-b)){
    heat+='<div class="h">'+r+'</div>';
    for(let b=1;b<=10;b++){
      const f=S.facts[factKey(r,b)];
      const col=f.box>=5?'#F2B83C':f.box>=4?'#B893F2':f.box>=3?'#CDB4F0':f.box>=2?'#E3D6F6':f.seen>0?'#EFE8F9':'#F3F0F8';
      heat+='<div class="c" style="background:'+col+'" title="'+r+'·'+b+': Box '+f.box+(avgRt(f)?', ø '+(avgRt(f)/1000).toFixed(1)+' s':'')+'">'+(f.no>f.ok&&f.seen>1?'!':'')+'</div>';
    }
  }
  heat+='</div>';

  let chart='<div class="chart">';
  for(const x of days){
    const h=Math.round(x.e.sec/maxSec*100);
    chart+='<div class="col"><span class="v">'+(x.e.sec?Math.round(x.e.sec/60):'')+'</span><i class="b" style="height:'+Math.round(h*0.72)+'%"></i><span class="l">'+x.d.slice(8)+'.</span></div>';
  }
  chart+='</div>';

  const bests=Object.entries(S.best.rows).map(([r,ms])=>'<span class="pill">'+r+'er: '+(ms/1000).toFixed(1).replace('.',',')+' s</span>').join('') || '<span class="pill">noch keine</span>';

  w.innerHTML=
    '<div class="kpis">'
    +'<div class="kpi"><b>'+mastered+' / 100</b><span>Fakten sicher (Box ≥ 3)</span></div>'
    +'<div class="kpi"><b>'+gold+'</b><span>davon blitzschnell (Gold)</span></div>'
    +'<div class="kpi"><b>'+(tasks7?Math.round(ok7/tasks7*100)+' %':'–')+'</b><span>richtig, letzte 7 Tage</span></div>'
    +'<div class="kpi"><b>'+avgFast+' s</b><span>ø Antwortzeit (sichere Fakten)</span></div>'
    +'<div class="kpi"><b>'+fmtMin(totalSec)+'</b><span>Übungszeit gesamt</span></div>'
    +'<div class="kpi"><b>'+(S.best.blitz||'–')+'</b><span>Rekord Sternschnuppe</span></div>'
    +'</div>'
    +'<h2>Übungszeit, letzte 14 Tage (Minuten)</h2>'+chart
    +'<h2>Lern-Backlog: alle 100 Fakten</h2>'
    +'<div class="legend"><span><i style="background:#F3F0F8"></i>neu</span><span><i style="background:#E3D6F6"></i>in Arbeit</span><span><i style="background:#CDB4F0"></i>sicher</span><span><i style="background:#F2B83C"></i>blitzschnell</span><span>! = Stolperfakt</span></div>'
    +heat
    +'<h2>Bestzeiten Inselritt</h2><div class="besttimes">'+bests+'</div>'
    +'<h2>Kawumm (Rückwärtsreihen)</h2>'+(window.KW?KW.parentHTML():'')
    +'<h2>Einstellungen</h2>'
    +'<div class="setrow"><label>Name des Kindes</label><input type="text" id="setName" value="'+S.name.replace(/"/g,'&quot;')+'"></div>'
    +'<div class="setrow"><label>Ton und Vorlesen</label><button class="toggle'+(S.sound?' on':'')+'" id="setSound" role="switch" aria-checked="'+S.sound+'" aria-label="Ton"><i></i></button></div>'
    +'<div class="setrow"><label>Vorlesen prüfen</label><button class="smallbtn" id="setVoiceTest">Stimme testen</button></div>'
    +'<div id="voiceDiag" style="font-size:12px;color:var(--muted);font-weight:600;margin:-4px 0 6px"></div>'
    +'<div class="setrow"><label>Aufgaben pro Runde</label><div>'+[5,10,15].map(n=>'<button class="smallbtn" data-tc="'+n+'" style="'+(S.tasksPerRound===n?'background:var(--accent-soft)':'')+'">'+n+'</button>').join(' ')+'</div></div>'
    +'<h2>Sicherung</h2>'
    +'<p style="margin:2px 0;font-size:13px;color:var(--muted)">Einmal am Tag legt Lumi nach der ersten Runde eine Sicherungsdatei in den Download-Ordner (lumi-sicherung-Datum.json). Letzte Sicherung: '+(lastBackupDay()||'noch keine')+'</p>'
    +(CAN_FIXED_FILE?'<p style="margin:4px 0;font-size:13px;color:var(--muted)">Besser: eine feste Datei wählen. Dann überschreibt Lumi jeden Tag dieselbe Datei statt neue anzulegen. Feste Datei: <b id="bkFixedName">…</b></p><div class="btnrow" style="justify-content:flex-start"><button class="smallbtn" id="bkFixed">Feste Sicherungsdatei wählen</button></div>':'<p style="margin:4px 0;font-size:13px;color:var(--muted)">Dieses Gerät kann keine feste Datei überschreiben, darum entsteht jeden Tag eine neue. Alte Dateien kannst du gefahrlos löschen, die neueste reicht.</p>')
    +'<div class="btnrow" style="justify-content:flex-start"><button class="smallbtn" id="bkNow">Jetzt sichern</button><button class="smallbtn" id="bkFileBtn">Sicherungsdatei laden</button><input type="file" id="bkFile" accept=".json,application/json" hidden></div>'
    +'<p style="margin:8px 0 2px;font-size:13px;color:var(--muted)">Oder als Text kopieren und auf einem anderen Gerät einfügen:</p>'
    +'<textarea class="backup" id="backupTa"></textarea>'
    +'<div class="btnrow" style="justify-content:flex-start">'
    +'<button class="smallbtn" id="bkExport">Lernstand anzeigen</button>'
    +'<button class="smallbtn" id="bkCopy">Kopieren</button>'
    +'<button class="smallbtn" id="bkImport">Eingefügten Stand laden</button>'
    +'<button class="smallbtn danger" id="bkReset">Alles zurücksetzen</button>'
    +'</div><div id="bkMsg" style="font-size:13px;color:var(--muted);font-weight:700;"></div>';

  if(window.KW) KW.parentWire();
  $('setName').addEventListener('change',e=>{ S.name=(e.target.value||'').trim()||'Du'; save(); });
  $('setSound').addEventListener('click',()=>{ S.sound=!S.sound; save(); renderParent(); });
  $('setVoiceTest').addEventListener('click',()=>{
    unlockSpeech(); speak('Hallo '+S.name+'! Ich bin Lumi. Hörst du mich?'); $('voiceDiag').textContent='Ich teste …';
    setTimeout(()=>{ const de=voices.filter(v=>/^de/i.test(v.lang)).length;
      $('voiceDiag').textContent='Stimmen: '+voices.length+' (deutsch: '+de+') · gesprochen: '+speechDiag.starts+' von '+speechDiag.calls+' · Weg: '+speechDiag.mode+' · Neuversuche: '+speechDiag.retries+(speechDiag.lastErr?' · Fehler: '+speechDiag.lastErr:'')+(S.sound?'':' · Ton ist aus!')+(IS_ANDROID?' · Android':''); },5000);
  });
  w.querySelectorAll('[data-tc]').forEach(b=>b.addEventListener('click',()=>{ S.tasksPerRound=parseInt(b.dataset.tc,10); save(); renderParent(); }));
  $('bkNow').addEventListener('click',async()=>{ if(await backupToFixed()) $('bkMsg').textContent='In die feste Sicherungsdatei geschrieben.'; else { downloadBackup(); $('bkMsg').textContent='Sicherungsdatei liegt im Download-Ordner.'; } });
  if(CAN_FIXED_FILE){
    idbGet('handle').then(h=>{ const el=$('bkFixedName'); if(el) el.textContent=h?h.name:'noch keine'; }).catch(()=>{});
    $('bkFixed').addEventListener('click',async()=>{
      try{ const h=await chooseFixedFile(); $('bkFixedName').textContent=h.name; $('bkMsg').textContent='Feste Datei gewählt und gesichert. Ab jetzt wird sie jeden Tag überschrieben.'; }
      catch(e){ $('bkMsg').textContent=(e&&e.name==='AbortError')?'Abgebrochen.':'Das hat nicht geklappt. Es bleibt bei der täglichen Download-Datei.'; }
    });
  }
  $('bkFileBtn').addEventListener('click',()=>$('bkFile').click());
  $('bkFile').addEventListener('change',async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{ const p=JSON.parse(await f.text()); if(p&&p.v===1&&p.facts){ S=p; if(!S.islands) S.islands={}; if(!S.spent) S.spent=0; if(!S.gear){ S.gear=gearOf(S.items||0); S.rewards=S.items||0; } save(); renderParent(); $('bkMsg').textContent='Lernstand aus der Datei geladen.'; } else throw 0; }
    catch(err){ $('bkMsg').textContent='Das ist keine Lumi-Sicherungsdatei.'; }
  });
  $('bkExport').addEventListener('click',()=>{ $('backupTa').value=JSON.stringify(S); $('bkMsg').textContent='Stand steht im Feld.'; });
  $('bkCopy').addEventListener('click',async()=>{
    $('backupTa').value=JSON.stringify(S);
    try{ await navigator.clipboard.writeText($('backupTa').value); $('bkMsg').textContent='Kopiert.'; }
    catch(e){ $('backupTa').focus(); $('backupTa').select(); $('bkMsg').textContent='Bitte manuell kopieren (Text ist markiert).'; }
  });
  $('bkImport').addEventListener('click',()=>{
    try{ const p=JSON.parse($('backupTa').value); if(p&&p.v===1&&p.facts){ S=p; save(); renderParent(); $('bkMsg').textContent='Lernstand geladen.'; } else throw 0; }
    catch(e){ $('bkMsg').textContent='Das sieht nicht nach einem Lernstand aus.'; }
  });
  let resetArmed=false;
  $('bkReset').addEventListener('click',()=>{
    if(!resetArmed){ resetArmed=true; $('bkReset').textContent='Wirklich? Nochmal tippen'; setTimeout(()=>{resetArmed=false; const b=$('bkReset'); if(b) b.textContent='Alles zurücksetzen';},4000); return; }
    S=defaultState(); save(); lastOpenCount=1; renderParent(); $('bkMsg').textContent='Alles auf Anfang.';
  });
}

/* ---------- Start ---------- */
function initStars(){
  const l=$('starsLayer'); if(!l||l.childElementCount) return;
  for(let i=0;i<16;i++){ const st=document.createElement('i'); st.textContent='✦';
    st.style.left=(4+Math.random()*92)+'%'; st.style.top=(3+Math.random()*50)+'%';
    st.style.fontSize=(8+Math.random()*9)+'px'; st.style.animationDelay=(Math.random()*2.5)+'s';
    l.appendChild(st); }
}
/* Tipp-Sperre: schluckt kurz alle Klicks, z. B. nach dem Überspringen des Intros */
let tapGuardUntil=0;
function tapGuard(ms){ tapGuardUntil=Math.max(tapGuardUntil, Date.now()+ms); }
document.addEventListener('click',e=>{ if(Date.now()<tapGuardUntil){ e.stopPropagation(); e.preventDefault(); } },true);
let introTouched=false;
async function playIntroOnce(){
  const eng=window.Wolkenritt;
  if(!eng || !('ResizeObserver' in window)) return;
  const box=$('intro'); box.hidden=false;
  try{
    // erst der Ruf-Knopf: schaltet den Ton frei (Browser spielen vor der ersten Berührung nichts)
    await new Promise(res=>{ const b=$('introCall'); b.hidden=false; b.onclick=()=>{ unlockSpeech(); b.hidden=true; $('introCard').hidden=true; res(); }; });
    $('introHint').hidden=false;
    box.addEventListener('pointerdown',()=>{ introTouched=true; },{once:true});
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const u=$('unicornHome').getBoundingClientRect();
    const target={x:u.left+u.width/2, y:u.top+u.height*0.52, w:u.width*0.95};
    playIntroMusic();
    await eng.playIntro($('introHost'), {target, items:gearKey(S.gear), onLand:()=>{ sndFanfare(); setTimeout(()=>speak('Hallo '+S.name+'! Lumi ist da!'),500); }});
  }catch(e){}
  if(introTouched) tapGuard(1400);   // der Tipp zum Überspringen darf nicht im Menü dahinter landen
  box.classList.add('fade'); setTimeout(()=>{ box.hidden=true; box.classList.remove('fade'); $('introHost').innerHTML=''; },650);
}
function sndWhoosh(){ for(let i=0;i<6;i++) tone(220+i*90,.12,i*0.08,'triangle',.05); }
function init(){
  load();
  initStars();
  lastOpenCount=unlockedRows(S).length;
  if(window.KW) KW.setup();
  show('home');
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(()=>playIntroOnce().then(()=>{ if(window.KW) KW.maybeLetter(); }), 150);
  else if(window.KW) setTimeout(()=>KW.maybeLetter(), 600);
}
const _boot=()=>init();
(window.claude&&window.claude.hot&&window.claude.hot.ready)? window.claude.hot.ready(_boot) : _boot();
</script>

<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
</script>
